[build]
  command = "npx prisma generate && npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PRISMA_CLI_QUERY_ENGINE_TYPE = "library"

[context.deploy-preview]
  command = "npx prisma generate && npm run build"

[context.branch-deploy]
  command = "npx prisma generate && npm run build"

# Auth endpoints
[[redirects]]
  from = "/api/auth/register"
  to = "/.netlify/functions/auth-register"
  status = 200

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/me"
  to = "/.netlify/functions/auth-me"
  status = 200

# Admin live sessions (must precede /api/* wildcard)
[[redirects]]
  from = "/api/admin/live-sessions"
  to = "/.netlify/functions/admin-live-sessions"
  status = 200

# Other API endpoints (courses, missions, enrollments, progress, quizzes, dashboard)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback (must be LAST)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200